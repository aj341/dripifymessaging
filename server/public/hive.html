<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Design Bees — Hive Wall</title>
<style>
  :root{
    --bg:#f7f5fc; --surface:#fff; --surface-2:#f1edf9; --border:#e6e1f1;
    --ink:#1b1630; --muted:#6a6484;
    --accent:#7c3aed; --accent-ink:#5b21b6; --accent-soft:#efe7ff;
    --honey:#b9791a; --honey-soft:#f9efd8; --honey-line:#e7c983;
    --fact:#15803d; --fact-soft:#dcfbe6;
    --hyp:#b45309; --hyp-soft:#fbedd6;
    --unknown:#6a6484; --unknown-soft:#eceaf3;
    --hex:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#13101d; --surface:#1c172c; --surface-2:#231c38; --border:#342a4c;
      --ink:#f2eefb; --muted:#a79fc2;
      --accent:#a889f7; --accent-ink:#c9b4fb; --accent-soft:#2a2143;
      --honey:#e6b24d; --honey-soft:#302610; --honey-line:#5a481f;
      --fact:#4ec27a; --fact-soft:#16301f; --hyp:#e0a13a; --hyp-soft:#33260f;
      --unknown:#a79fc2; --unknown-soft:#241d38;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 0;position:sticky;top:0;z-index:10}
  header .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{width:36px;height:36px;background:var(--honey-soft);border:1px solid var(--honey-line);clip-path:var(--hex);display:grid;place-items:center;font-size:18px}
  header h1{font-size:19px;font-weight:750;letter-spacing:-.02em}
  header h1 small{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
  .status{margin-left:auto;display:flex;gap:8px;align-items:center;font-family:ui-monospace,monospace;font-size:11.5px}
  .pill{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);display:flex;gap:6px;align-items:center}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--unknown)}
  .pill.ok .dot{background:var(--fact)}
  .pill.off .dot{background:#c2320f}

  section{padding:30px 0}
  .eyebrow{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);font-weight:600;margin-bottom:14px}

  .workers{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .wnode{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 10px;text-align:center}
  .whex{width:38px;height:38px;margin:0 auto 8px;clip-path:var(--hex);display:grid;place-items:center;font-size:18px;background:var(--accent-soft);border:1px solid var(--accent)}
  .wnode h3{font-size:14px;font-weight:700}
  .wnode p{font-size:11px;color:var(--muted);margin-top:2px;min-height:26px}
  .wnode .st{margin-top:8px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}

  .cols{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .card h2{font-size:15px;font-weight:750;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .count{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px}

  .signal{border-top:1px solid var(--border);padding:14px 0}
  .signal:first-of-type{border-top:none;padding-top:0}
  .signal .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .who{font-size:12.5px;font-weight:650;color:var(--accent-ink)}
  .badge{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:6px;text-transform:uppercase}
  .b-fact{background:var(--fact-soft);color:var(--fact)}
  .b-hypothesis{background:var(--hyp-soft);color:var(--hyp)}
  .b-unknown{background:var(--unknown-soft);color:var(--unknown)}
  .signal .ttl{font-size:14.5px;font-weight:600;margin:6px 0 2px}
  .signal .body{font-size:13.5px;color:var(--ink)}
  .receipt{margin-top:8px;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-left:2px solid var(--honey);border-radius:6px;padding:7px 10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
  .receipt b{color:var(--honey)}
  .time{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--muted);margin-left:auto}

  .question{border-top:1px solid var(--border);padding:12px 0;font-size:13.5px}
  .question:first-of-type{border-top:none;padding-top:0}
  .question .who{margin-bottom:3px}

  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .empty b{color:var(--ink)}
  footer{color:var(--muted);font-size:12px;padding:30px 0 50px;border-top:1px solid var(--border);margin-top:10px}

  @media (max-width:820px){
    .workers{grid-template-columns:repeat(3,1fr)}
    .cols{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">🐝</div>
      <h1>Hive Wall <small>everyone's thoughts, evidence-backed</small></h1>
      <div class="status" id="status">
        <span class="pill" id="db-pill"><span class="dot"></span>brain</span>
        <span class="pill" id="tg-pill"><span class="dot"></span>telegram</span>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section>
      <div class="eyebrow">The workforce</div>
      <div class="workers" id="workers"></div>
    </section>

    <section class="cols">
      <div class="card">
        <h2>Signals <span class="count" id="sig-count">0</span></h2>
        <div id="signals"><div class="empty">Loading…</div></div>
      </div>
      <div class="card">
        <h2>Open questions <span class="count" id="q-count">0</span></h2>
        <div id="questions"><div class="empty">Loading…</div></div>
      </div>
    </section>

    <footer>
      Design Bees Hive · Phase 0. Every signal shows its receipt — the source it
      came from. <span class="mono">fact</span> / <span class="mono">hypothesis</span> /
      <span class="mono">unknown</span> are labelled, never blurred.
    </footer>
  </div>

<script>
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const ago = (iso) => {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  };
  const receipt = (src) => {
    if (!src || typeof src !== 'object') return '';
    const parts = Object.entries(src).map(([k,v]) =>
      `<b>${esc(k)}:</b> ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}`);
    return `<div class="receipt">${parts.join('  ·  ')}</div>`;
  };

  async function health(){
    try {
      const h = await (await fetch('/health')).json();
      const db = document.getElementById('db-pill');
      const tg = document.getElementById('tg-pill');
      db.className = 'pill ' + (h.db ? 'ok' : 'off');
      db.lastChild.textContent = h.db ? 'brain connected' : 'brain down';
      tg.className = 'pill ' + (h.telegram ? 'ok' : 'off');
      tg.lastChild.textContent = h.telegram ? 'telegram live' : 'telegram off';
    } catch {}
  }

  async function load(){
    const data = await (await fetch('/api/hive')).json();

    document.getElementById('workers').innerHTML = data.workers.map(w => `
      <div class="wnode">
        <div class="whex">${esc(w.emoji)}</div>
        <h3>${esc(w.name)}</h3>
        <p>${esc(w.role || '')}</p>
        <div class="st">${esc(w.status || 'idle')}</div>
      </div>`).join('');

    document.getElementById('sig-count').textContent = data.signals.length;
    document.getElementById('signals').innerHTML = data.signals.length
      ? data.signals.map(s => `
        <div class="signal">
          <div class="top">
            <span class="who">${esc(s.worker_emoji)} ${esc(s.worker_name)}</span>
            <span class="badge b-${esc(s.confidence)}">${esc(s.confidence)}</span>
            <span class="time">${ago(s.created_at)}</span>
          </div>
          <div class="ttl">${esc(s.title)}</div>
          ${s.body ? `<div class="body">${esc(s.body)}</div>` : ''}
          ${receipt(s.source)}
        </div>`).join('')
      : `<div class="empty"><b>No signals yet.</b> Workers will post findings here as they come on shift — each with its receipt.</div>`;

    document.getElementById('q-count').textContent = data.questions.length;
    document.getElementById('questions').innerHTML = data.questions.length
      ? data.questions.map(q => `
        <div class="question">
          <div class="who">${esc(q.worker_emoji)} ${esc(q.worker_name)} asks</div>
          <div>${esc(q.question)}</div>
        </div>`).join('')
      : `<div class="empty"><b>Nothing to answer.</b> When a worker needs your call, it appears here and pings your Telegram.</div>`;
  }

  function tick(){ health(); load().catch(e => console.error(e)); }
  tick();
  setInterval(tick, 15000);
</script>
</body>
</html>
